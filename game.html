<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Success</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body class="w-full h-screen bg-white flex flex-col items-center justify-center text-white p-4">

<p class="mt-6 text-5xl tracking-wide bg-black/20 px-8 py-5 rounded font-mono">
    <span id="card-data-display">Loading...</span>
</p>
<img src="llama.png" class="h-100 w-100 m-5 object-contain" alt="llama" />

<p id="ws-status" class="text-black text-lg font-mono">Connecting...</p>

<a href="index.html" class="mt-8 border-2 p-2 font-bold hover:bg-white hover:text-green-600 transition-colors">
    Go Back
</a>
<script type="module">
    const latestSwipe = sessionStorage.getItem('latest_swipe');
    const displayElement = document.getElementById('card-data-display');
    if (latestSwipe && latestSwipe.length === 16) {
    const digits = latestSwipe.split('');
    const randomIndex = Math.floor(Math.random() * digits.length);
    const initialDigit = digits[randomIndex];
    const remainingDigits = digits.filter((_, index) => index !== randomIndex);
    remainingDigits.sort(() => Math.random() - 0.5);
    let displayedText = initialDigit;
    displayElement.textContent = displayedText;
    
    const intervalId = setInterval(() => {
        if (remainingDigits.length > 0) {
        const nextDigit = remainingDigits.shift();
        displayedText += nextDigit;
        displayElement.textContent = displayedText;
        } else {
        clearInterval(intervalId);
        }
    }, 3000);
        startGame();
    } else {
        displayElement.textContent = "No Valid Scan Data Found";
    }

    const wsStatus = document.getElementById('ws-status');
    const ws = new WebSocket("ws://10.121.99.121:81");
    ws.onopen = () => {
        wsStatus.textContent = "Connected";
        if (sessionStorage.getItem('latest_swipe')?.length === 16) {
            ws.send("START_GAME");
        }
    };
    ws.onclose = () => { wsStatus.textContent = "Disconnected"; };
    ws.onerror = () => { wsStatus.textContent = "Connection error"; };
    ws.onmessage = (e) => {
        wsStatus.textContent = e.data;
        if (e.data === "GAME_OVER") wsStatus.textContent = "Game Over!";
    };
    function startGame(){
        // START_GAME is now sent in onopen to avoid a race condition
    }

</script>
</body>
</html>
